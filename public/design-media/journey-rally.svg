<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Rally">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a0e"/>
      <stop offset="100%" stop-color="#0c1218"/>
    </linearGradient>
    <filter id="g" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#070a0e"/>
  <!-- court perspective -->
  <polygon points="180,120 780,120 900,520 60,520" fill="url(#floor)" stroke="#f2f4f5" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="180" y1="120" x2="780" y2="120" stroke="#1ad9e8" stroke-opacity="0.7" stroke-width="2" filter="url(#g)"/>
  <line x1="220" y1="200" x2="740" y2="200" stroke="#f2f4f5" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="300" y1="340" x2="660" y2="340" stroke="#f2f4f5" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="480" y1="120" x2="480" y2="520" stroke="#f2f4f5" stroke-opacity="0.12" stroke-width="1"/>
  <!-- tin band -->
  <rect x="200" y="460" width="560" height="28" fill="#070a0e" stroke="#f2f4f5" stroke-opacity="0.4"/>
  <text x="240" y="480" fill="#1ad9e8" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="16" font-weight="700">4</text>
  <text x="720" y="480" fill="#f06e14" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="16" font-weight="700" text-anchor="end">3</text>
  <text x="480" y="480" fill="#1ad9e8" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" filter="url(#g)">4 – 3</text>
  <!-- ball -->
  <circle cx="520" cy="280" r="7" fill="#ff8f2e" filter="url(#g)"/>
  <!-- chrome -->
  <text x="48" y="48" fill="#1ad9e8" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">sq_</text>
  <text x="48" y="72" fill="#9aadb2" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11">phase: rally</text>
  <text x="912" y="48" fill="#9aadb2" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11" text-anchor="end">Rally</text>
  <text x="480" y="560" fill="#9aadb2" font-family="'IBM Plex Mono', Consolas, monospace" font-size="12" text-anchor="middle">Diegetic tin · canHit tint</text>
</svg>
