<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440" role="img">
  <title>Space is not a power meter. Hold sets length. Aim X sets width. Stick Y sets attack plane: toward the front wall from above, toward you from below.</title>
  <desc>Left half is chase on Shift. Right half is the shot: a length bar that grows through tap, drive, and full; a width arc; and a vertical attack-plane rail.</desc>
  <defs>
    <style><![CDATA[
      @media (prefers-reduced-motion: no-preference) {
        .ttl, .sub, .half, .tick, .rail, .dot { opacity: 0; animation: fade .4s ease forwards; }
        .ttl { animation-delay: .08s }
        .sub { animation-delay: .2s }
        .hL { animation-delay: .35s }
        .hR { animation-delay: .5s }
        .t0 { animation-delay: 1.15s }
        .t1 { animation-delay: 1.35s }
        .t2 { animation-delay: 1.55s }
        .rail { animation-delay: 1.4s }
        .dot { animation-delay: 1.7s }
        .len { transform: scaleX(0); transform-box: fill-box; transform-origin: left center; animation: grow .55s cubic-bezier(.2,.8,.3,1) 1.05s forwards; }
        .arc { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw .5s ease 1.2s forwards; }
      }

      @keyframes fade { to { opacity: 1 } }
      @keyframes grow { to { transform: scaleX(1) } }
      @keyframes draw { to { stroke-dashoffset: 0 } }
    ]]></style>
  </defs>

  <rect width="850" height="440" fill="#070a0e"/>

  <text class="ttl" x="40" y="44" fill="#eef6f7" font-family="Chakra Petch, Bahnschrift, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">SPACE IS NOT A POWER METER</text>
  <text class="sub" x="40" y="68" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">Hold = length. X = width. Y = attack plane.</text>

  <line x1="425" y1="92" x2="425" y2="400" stroke="#f2f4f5" stroke-opacity=".18" stroke-width="1"/>

  <!-- left: chase -->
  <g class="half hL">
    <text x="40" y="108" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">LEFT HALF</text>
    <text x="40" y="136" fill="#eef6f7" font-family="Chakra Petch, Bahnschrift, 'Segoe UI', sans-serif" font-size="20" font-weight="700">CHASE</text>
    <text x="40" y="160" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">Shift · RMB · hold</text>
    <circle cx="200" cy="250" r="7" fill="#ff8f2e"/>
    <path d="M120 310 L188 258" fill="none" stroke="#1ad9e8" stroke-width="1.6" stroke-linecap="butt"/>
    <rect x="108" y="298" width="24" height="24" fill="none" stroke="#1ad9e8" stroke-width="1.4"/>
    <text x="40" y="360" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">Move toward the ball.</text>
    <text x="40" y="378" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">Timing with the shot is the loop.</text>
  </g>

  <!-- right: shot -->
  <g class="half hR">
    <text x="450" y="108" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">RIGHT HALF</text>
    <text x="450" y="136" fill="#eef6f7" font-family="Chakra Petch, Bahnschrift, 'Segoe UI', sans-serif" font-size="20" font-weight="700">SHOT</text>
    <text x="450" y="160" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">Space · LMB · hold, then release</text>

    <!-- length bar: grow is the data -->
    <text x="450" y="196" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10">LENGTH · 120750 ms</text>
    <rect x="450" y="208" width="280" height="8" fill="none" stroke="#f2f4f5" stroke-opacity=".28" stroke-width="1"/>
    <rect class="len" x="450" y="208" width="280" height="8" fill="#1ad9e8"/>
    <g class="tick t0">
      <line x1="450" y1="208" x2="450" y2="226" stroke="#eef6f7" stroke-width="1.2"/>
      <text x="450" y="240" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9">tap</text>
    </g>
    <g class="tick t1">
      <line x1="560" y1="208" x2="560" y2="226" stroke="#eef6f7" stroke-width="1.2"/>
      <text x="560" y="240" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">drive</text>
    </g>
    <g class="tick t2">
      <line x1="730" y1="208" x2="730" y2="226" stroke="#eef6f7" stroke-width="1.2"/>
      <text x="730" y="240" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">full</text>
    </g>

    <!-- width arc -->
    <text x="450" y="272" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10">WIDTH · AIM X</text>
    <path class="arc" d="M470 330 A 120 120 0 0 1 710 330" fill="none" stroke="#eef6f7" stroke-width="1.4"/>
    <text x="470" y="348" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">boast</text>
    <text x="590" y="318" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">straight</text>
    <text x="710" y="348" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">boast</text>

    <!-- attack plane rail: front = from above -->
    <g class="rail">
      <line x1="800" y1="176" x2="800" y2="360" stroke="#f2f4f5" stroke-opacity=".35" stroke-width="1.4"/>
      <line x1="794" y1="176" x2="806" y2="176" stroke="#eef6f7" stroke-width="1.4"/>
      <line x1="794" y1="268" x2="806" y2="268" stroke="#9aadb2" stroke-width="1.2"/>
      <line x1="794" y1="360" x2="806" y2="360" stroke="#eef6f7" stroke-width="1.4"/>
      <text x="788" y="180" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">front · above</text>
      <text x="788" y="272" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">neutral</text>
      <text x="788" y="364" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">back · below</text>
    </g>
    <circle class="dot" cx="800" cy="248" r="4" fill="#1ad9e8"/>
  </g>
</svg>
