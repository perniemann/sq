<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440" role="img">
  <title>Shot controls: holding Space sets shot length, dragging left or right sets width, dragging up or down sets attack plane (front wall side is from above, back wall side is from below).</title>
  <desc>Left half is chase on Shift. Right half is the shot: a length bar showing tap, drive, and full; a width arc; and a vertical attack-plane rail.</desc>

  <rect width="850" height="440" fill="#070a0e"/>

  <text x="40" y="44" fill="#eef6f7" font-family="Chakra Petch, Bahnschrift, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="1">SHOT CONTROLS</text>
  <text x="40" y="68" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">Hold sets length. Drag X sets width. Drag Y sets attack plane.</text>

  <line x1="425" y1="92" x2="425" y2="400" stroke="#f2f4f5" stroke-opacity=".18" stroke-width="1"/>

  <!-- left: chase -->
  <g>
    <text x="40" y="108" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">LEFT HALF</text>
    <text x="40" y="136" fill="#eef6f7" font-family="Chakra Petch, Bahnschrift, 'Segoe UI', sans-serif" font-size="18" font-weight="700">CHASE</text>
    <text x="40" y="160" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">Shift, or right mouse button, held</text>
    <circle cx="200" cy="250" r="7" fill="#ff8f2e"/>
    <path d="M120 310 L188 258" fill="none" stroke="#1ad9e8" stroke-width="1.6" stroke-linecap="butt"/>
    <rect x="108" y="298" width="24" height="24" fill="none" stroke="#1ad9e8" stroke-width="1.4"/>
    <text x="40" y="360" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">Moves you toward the ball.</text>
    <text x="40" y="378" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">Timing it with the shot is the game.</text>
  </g>

  <!-- right: shot -->
  <g>
    <text x="450" y="108" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">RIGHT HALF</text>
    <text x="450" y="136" fill="#eef6f7" font-family="Chakra Petch, Bahnschrift, 'Segoe UI', sans-serif" font-size="18" font-weight="700">SHOT</text>
    <text x="450" y="160" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12">Space, or left mouse button, held then released</text>

    <text x="450" y="196" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10">LENGTH, 120 to 750 ms</text>
    <rect x="450" y="208" width="280" height="8" fill="none" stroke="#f2f4f5" stroke-opacity=".28" stroke-width="1"/>
    <rect x="450" y="208" width="280" height="8" fill="#1ad9e8"/>
    <g>
      <line x1="450" y1="208" x2="450" y2="226" stroke="#eef6f7" stroke-width="1.2"/>
      <text x="450" y="240" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9">tap</text>
    </g>
    <g>
      <line x1="560" y1="208" x2="560" y2="226" stroke="#eef6f7" stroke-width="1.2"/>
      <text x="560" y="240" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">drive</text>
    </g>
    <g>
      <line x1="730" y1="208" x2="730" y2="226" stroke="#eef6f7" stroke-width="1.2"/>
      <text x="730" y="240" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">full</text>
    </g>

    <!-- width arc -->
    <text x="450" y="272" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10">WIDTH, DRAG X</text>
    <path d="M470 330 A 120 120 0 0 1 710 330" fill="none" stroke="#eef6f7" stroke-width="1.4"/>
    <text x="470" y="348" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">boast</text>
    <text x="590" y="318" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">straight</text>
    <text x="710" y="348" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="middle">boast</text>

    <!-- attack plane rail: front wall side is from above -->
    <g>
      <line x1="800" y1="176" x2="800" y2="360" stroke="#f2f4f5" stroke-opacity=".35" stroke-width="1.4"/>
      <line x1="794" y1="176" x2="806" y2="176" stroke="#eef6f7" stroke-width="1.4"/>
      <line x1="794" y1="268" x2="806" y2="268" stroke="#9aadb2" stroke-width="1.2"/>
      <line x1="794" y1="360" x2="806" y2="360" stroke="#eef6f7" stroke-width="1.4"/>
      <text x="788" y="180" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">front wall, above</text>
      <text x="788" y="272" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">neutral</text>
      <text x="788" y="364" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" text-anchor="end">back wall, below</text>
    </g>
    <circle cx="800" cy="248" r="4" fill="#1ad9e8"/>
  </g>
</svg>
