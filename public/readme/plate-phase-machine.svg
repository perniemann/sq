<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img">
  <title>Phase machine: idle to serving to rally, rally branches to point, gameOver, or matchOver; point loops back to rally; gameOver and matchOver loop back to serving.</title>
  <desc>Real gameStore phase union. Forward transitions are solid. Advance, next game, and restart loops are dashed.</desc>
  <defs>
    <marker id="pm-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#9aadb2"/>
    </marker>
    <style><![CDATA[
      /* Base: fully visible for img embed, reduced motion, and no-JS. */
      .node, .elabel { opacity: 1; transform: translateY(0); }
      .draw { stroke-dashoffset: 0; }

      @media (prefers-reduced-motion: no-preference) {
        .draw { animation: drawStroke 0.48s ease-out forwards; }
        .e1 { animation-delay: 0.14s; }
        .e2 { animation-delay: 0.20s; }
        .e3 { animation-delay: 0.26s; }
        .e4 { animation-delay: 0.32s; }
        .e5 { animation-delay: 0.38s; }
        .node {
          transform-box: fill-box;
          transform-origin: center;
          animation: rise 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .n1 { animation-delay: 0s; }
        .n2 { animation-delay: 0.07s; }
        .n3 { animation-delay: 0.14s; }
        .n4 { animation-delay: 0.21s; }
        .n5 { animation-delay: 0.28s; }
        .n6 { animation-delay: 0.35s; }
        .elabel { animation: fadeIn 0.3s ease-out forwards; }
        .l1 { animation-delay: 0.26s; }
        .l2 { animation-delay: 0.32s; }
        .l3 { animation-delay: 0.38s; }
        .l4 { animation-delay: 0.44s; }
        .l5 { animation-delay: 0.50s; }
        .l6 { animation-delay: 0.56s; }
        .l7 { animation-delay: 0.62s; }
        .l8 { animation-delay: 0.68s; }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes drawStroke {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    ]]></style>
  </defs>

  <rect width="900" height="430" fill="#070a0e"/>

  <!-- Forward (solid) then dashed advance loops. Geometry from PhaseDiagram.tsx. -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="butt">
    <path class="draw e1" pathLength="1" stroke-dasharray="1" d="M160,210 L232,210" stroke="#eef6f7" stroke-opacity=".85" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
    <path class="draw e2" pathLength="1" stroke-dasharray="1" d="M372,210 L444,210" stroke="#eef6f7" stroke-opacity=".85" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
    <path class="draw e3" pathLength="1" stroke-dasharray="1" d="M584,196 C 630,160 650,100 700,72" stroke="#eef6f7" stroke-opacity=".85" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
    <path class="draw e4" pathLength="1" stroke-dasharray="1" d="M584,210 L700,210" stroke="#eef6f7" stroke-opacity=".85" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
    <path class="draw e5" pathLength="1" stroke-dasharray="1" d="M584,224 C 630,260 650,300 700,320" stroke="#eef6f7" stroke-opacity=".85" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
    <path pathLength="1" stroke-dasharray="0.02 0.02" d="M700,92 C 650,140 610,168 584,182" stroke="#9aadb2" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
    <path pathLength="1" stroke-dasharray="0.02 0.02" d="M700,238 C 650,300 500,360 302,238" stroke="#9aadb2" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
    <path pathLength="1" stroke-dasharray="0.02 0.02" d="M700,352 C 650,410 400,410 220,238" stroke="#9aadb2" stroke-opacity=".55" stroke-width="1.5" marker-end="url(#pm-arrow)"/>
  </g>

  <text class="elabel l1" x="196" y="200" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">space / click</text>
  <text class="elabel l2" x="408" y="200" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">strike</text>
  <text class="elabel l3" x="620" y="128" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">ball out · tin · double bounce</text>
  <text class="elabel l4" x="642" y="200" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">game won</text>
  <text class="elabel l5" x="646" y="285" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">match won</text>
  <text class="elabel l6" x="636" y="155" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">advance (space)</text>
  <text class="elabel l7" x="500" y="358" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">next game (space)</text>
  <text class="elabel l8" x="460" y="402" text-anchor="middle" fill="#9aadb2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">restart (space)</text>

  <g class="node n1">
    <rect x="20" y="182" width="140" height="56" fill="#070a0e" stroke="#9aadb2" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="90" y="215" text-anchor="middle" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700">idle</text>
  </g>
  <g class="node n2">
    <rect x="232" y="182" width="140" height="56" fill="#070a0e" stroke="#9aadb2" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="302" y="215" text-anchor="middle" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700">serving</text>
  </g>
  <g class="node n3">
    <rect x="444" y="182" width="140" height="56" fill="#070a0e" stroke="#1ad9e8" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="514" y="215" text-anchor="middle" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700">rally</text>
  </g>
  <g class="node n4">
    <rect x="700" y="40" width="140" height="56" fill="#070a0e" stroke="#9aadb2" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="770" y="73" text-anchor="middle" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700">point</text>
  </g>
  <g class="node n5">
    <rect x="700" y="182" width="140" height="56" fill="#070a0e" stroke="#f06e14" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="770" y="215" text-anchor="middle" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700">gameOver</text>
  </g>
  <g class="node n6">
    <rect x="700" y="324" width="140" height="56" fill="#070a0e" stroke="#f06e14" stroke-opacity=".8" stroke-width="1.5"/>
    <text x="770" y="357" text-anchor="middle" fill="#eef6f7" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="14" font-weight="700">matchOver</text>
  </g>
</svg>
