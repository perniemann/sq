<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 64" role="img" aria-label="sq_">
  <title>sq_</title>
  <desc>Wordmark: geometric sq letters with square mark (ink frame, orange bottom wedge) on void plate for light and dark hosts.</desc>
  <!-- Void plate so ink strokes stay legible on GitHub light README — cropped to content -->
  <rect width="100" height="64" fill="#070a0e"/>
  <text
    x="10"
    y="46"
    font-family="Chakra Petch, Bahnschrift, 'Segoe UI', sans-serif"
    font-size="44"
    font-weight="700"
    letter-spacing="-1.4"
    fill="#eef6f7"
  >sq</text>
  <!-- ~letter sidebearing after "sq"; mark ink starts near x≈54 -->
  <g transform="translate(52 16) scale(1.05)" stroke-linejoin="miter" stroke-linecap="butt" fill="none">
    <rect x="3" y="3" width="26" height="26" stroke="#eef6f7" stroke-width="4.25"/>
    <path d="M3 29 L16 14 L29 29 Z" stroke="#f06e14" stroke-width="2.125"/>
  </g>
</svg>
