# Production deploy for https://sq.perniemann.com.
# CI is the quality gate; this job only builds and uploads.

name: Deploy to sq.perniemann.com

on:
  push:
    branches: [main]
    paths-ignore:
      - '.cursor/**'
      - '.cursorrules'
      - 'README.md'
      - '.gitignore'
      - '.vscode/**'
      - 'docs/**'
      # Workflow-only landings must not FTP before Test FTP / manual Deploy
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: deploy-sq-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Generate .htaccess
        run: |
          cat > dist/.htaccess << 'EOF'
          # Security headers
          <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set X-Frame-Options "SAMEORIGIN"
            Header set X-XSS-Protection "1; mode=block"
            Header set Referrer-Policy "strict-origin-when-cross-origin"
            Header set Permissions-Policy "camera=(), microphone=(), geolocation=()"
          </IfModule>

          # Immutable caching for Vite hashed assets (/assets/ directory)
          <IfModule mod_headers.c>
            <If "%{REQUEST_URI} =~ m#^/assets/#">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </If>
          </IfModule>

          # No-cache for entry points and unhashed root assets
          <IfModule mod_headers.c>
            <FilesMatch "^(index\.html|favicon\.png|favicon\.ico|sq-lockup\.svg|robots\.txt|sitemap\.xml|llms\.txt|llms-full\.txt)$">
              Header always unset Expires
              Header always unset Cache-Control
              Header always set Cache-Control "no-cache, no-store, must-revalidate"
            </FilesMatch>
          </IfModule>

          # No-cache for /design/index.html (directory document)
          <IfModule mod_headers.c>
            <If "%{REQUEST_URI} =~ m#^/design(/index\.html)?/?$#">
              Header always unset Expires
              Header always unset Cache-Control
              Header always set Cache-Control "no-cache, no-store, must-revalidate"
            </If>
          </IfModule>

          # Caching for static assets
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/jpg "access plus 1 year"
            ExpiresByType image/jpeg "access plus 1 year"
            ExpiresByType image/png "access plus 1 year"
            ExpiresByType image/gif "access plus 1 year"
            ExpiresByType image/svg+xml "access plus 1 year"
            ExpiresByType image/webp "access plus 1 year"
            ExpiresByType image/avif "access plus 1 year"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
            ExpiresByType application/wasm "access plus 1 year"
            ExpiresByType font/woff2 "access plus 1 year"
            ExpiresByType font/woff "access plus 1 year"
          </IfModule>

          # Brotli compression (preferred over gzip)
          <IfModule mod_brotli.c>
            AddOutputFilterByType BROTLI_COMPRESS text/html text/css application/javascript application/json image/svg+xml font/woff2 application/wasm
          </IfModule>

          # Gzip fallback
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
          </IfModule>
          EOF
      - name: Normalize server path (must end with /)
        id: serverdir
        run: |
          DIR="${{ secrets.SQ_FTP_PATH || '/' }}"
          [[ "$DIR" == "/" || -z "$DIR" ]] && echo "path=/" >> $GITHUB_OUTPUT || echo "path=${DIR%/}/" >> $GITHUB_OUTPUT
      - name: Deploy to sq.perniemann.com
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ steps.serverdir.outputs.path }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 300000
          log-level: minimal
          state-name: .ftp-deploy-sync-state-sq.json
      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://sq.perniemann.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow run:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
